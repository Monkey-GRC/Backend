name: CI (backend)

# Cierra DT-20: las pruebas viven en el repo y corren en cada PR. Es independiente de deploy-dev.yml (que despliega al
# hacer push a develop): este flujo valida antes de mergear. Para que bloquee el merge hay que marcar el job `verificar`
# como "required" en la protección de la rama (Settings → Branches), no se puede desde el workflow.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Postgres desechable: nace vacío en cada corrida, así que también se prueba que las migraciones aplican desde cero.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: monkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monkey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores de CI, no son secretos: la base se destruye al terminar el job.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/monkey
      APP_DATABASE_URL: postgresql://monkey_app:ci@localhost:5432/monkey
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/monkey
      # Contraseña que el paso de preparación le pone a monkey_app: la app de las pruebas e2e se conecta con ese rol.
      TEST_APP_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Compilar
        run: npm run build

      # `nest build` deja fuera los *.spec.ts y las pruebas e2e, y `ts-jest` no frena por tipos: sin este paso un error de tipos en una prueba llegaba a `develop` sin que nada lo viera.
      - name: Verificar los tipos (incluye las pruebas)
        run: npx tsc --noEmit

      - name: Pruebas unitarias
        run: npm test

      - name: Aplicar las migraciones desde cero
        run: npx prisma migrate deploy

      - name: Preparar el rol de la app y los catálogos
        run: |
          # Las migraciones crean monkey_app sin contraseña (igual que en staging).
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query(\"ALTER ROLE monkey_app PASSWORD 'ci'\");await c.end()})()"
          npm run catalog:load -- --apply
          npm run reference:load -- --apply

      - name: Verificar catálogos, clonado y audit trail contra la base real
        run: |
          npm run catalog:verify
          npm run reference:verify
          npm run clone:verify
          npm run audit:verify

      - name: Pruebas de aislamiento entre empresas (base de datos y API)
        run: npm run test:e2e

name: Deploy dev (backend)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar código al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/monkey-dev/backend"
          rm: true

      - name: Comprobar el entorno, migrar la base y (re)desplegar
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Rol DUEÑO de la base dev (la misma que usan el backend y el entorno local), solo para migrar. NO va en el .env del backend
          # (que solo lleva APP_DATABASE_URL, el rol monkey_app). Formato: postgresql://postgres:<clave>@<servidor de la base dev>:5432/monkey
          # (la clave con caracteres especiales va codificada como URL).
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        with:
          envs: MIGRATE_DATABASE_URL
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # script_stop: si un comando del script falla, el step (y el job)
          # deben fallar de verdad — sin esto, appleboy/ssh-action reporta
          # "success" aunque el build de Docker truene por dentro.
          script_stop: true
          script: |
            set -e
            # Los archivos de entorno (.env del backend y runner.env del trabajador) VIVEN EN EL SERVIDOR: este despliegue no los escribe ni los toca, así que no hay secretos
            # que reconvertir a base64 al añadir una variable. Se editan con `backend/scripts/deploy/set-env.sh`. Aquí solo se comprueba que estén completos: si falta algo,
            # el despliegue se detiene y dice qué (el backend anterior sigue corriendo).
            bash /home/ubuntu/monkey-dev/backend/scripts/deploy/check-env.sh /home/ubuntu/monkey-dev
            # 1) Migrar ANTES de levantar el backend nuevo. Si falla (set -e + script_stop), el deploy se
            #    aborta y el backend anterior sigue corriendo. Respalda antes de tocar la base: ver
            #    backend/scripts/deploy/migrate.sh y schema-implementacion.md §7 (reversa).
            bash /home/ubuntu/monkey-dev/backend/scripts/deploy/migrate.sh
            cd /home/ubuntu/monkey-dev
            docker compose build backend
            docker compose up -d backend
            # El trabajador solo se levanta si el compose de la VPS ya lo define y existe su entorno: así este paso no rompe el despliegue antes de actualizar el compose.
            if docker compose config --services | grep -qx runner && [ -f runner.env ]; then docker compose up -d docker-proxy runner; fi

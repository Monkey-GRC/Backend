AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Monkey - read-only access role. Lets Monkey READ the configuration of this AWS account to assess it.
  It cannot create, change or delete anything and cannot read the contents of your data.

Parameters:
  ExternalId:
    Type: String
    Description: Identifier generated by Monkey for this connection. Paste exactly what Monkey shows you.
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "[A-Za-z0-9_+=,.@:/-]+"
  MonkeyPrincipalArn:
    Type: String
    Description: The identity allowed to assume this role (Monkey's, provided by Monkey).
    AllowedPattern: "arn:aws:iam::[0-9]{12}:(root|user/.+|role/.+)"

Resources:
  MonkeyReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MonkeyReadOnly
      Description: Read-only access for Monkey to assess this account's configuration.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref MonkeyPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Tags:
        - Key: ManagedBy
          Value: Monkey
        - Key: Purpose
          Value: read-only-assessment

Outputs:
  RoleArn:
    Description: Paste this value into Monkey.
    Value: !GetAtt MonkeyReadOnlyRole.Arn
  AccountId:
    Description: The account being connected.
    Value: !Ref AWS::AccountId
